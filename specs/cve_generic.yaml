# CVE 复现 — 通用验证（target_type="other" 兜底）
target_type: other
label: "基本复现"

type_instruction: |
  【基本复现模式】用户选择 PoC 级验证。只需下载并运行公开 PoC 证明漏洞存在，
  不额外探索，不尝试扩展。验收标准：PoC 运行成功即可。

acceptance: |
  ## 基本复现验收标准

  此目标只需确认漏洞存在。运行公开 PoC 并展示关键输出即可。
  不需要扩展利用、不需要创建 attacker 用户、不需要提权。

exp_sh:
  header: |
    ### 1. exp.sh — PoC 运行脚本
    负责下载、编译、运行公开 PoC。不创建额外利用逻辑。
  sections:
    - title: "通用规则"
      rules:
        - "不使用 set -e，清理命令加 2>/dev/null || true"
        - "输出以 EXP 完成 结尾"
        - "展示 PoC 的关键输出，屏蔽编译噪声"

verify_sh:
  header: |
    ### 2. verify.sh — 一键验证脚本
    运行 exp.sh 并展示验证结果。可反复运行。
  sections:
    - title: "开头 — 运行 exp.sh"
      text: "运行 exp.sh: bash /tmp/exp.sh"
    - title: "结尾 — 展示 PoC 结果"
      text: |
        展示 PoC 输出中能证明漏洞存在的关键行。
        用 ✅/❌ 标记验证结果。
  skeleton: |
    #!/bin/sh

    # [COMPLIANCE CHECK: precondition]
    echo "━━━ [前置检查] 服务可用性 ━━━"

    # 自动启动（Agent 替换 __START_CMD__ 后生效，未替换则跳过）
    if ! curl -sf http://127.0.0.1:__PORT__/__HEALTH__ > /dev/null 2>&1; then
        if [ "__START_CMD__" != "__START_CMD__" ]; then
            echo "  ⚠️ 服务未运行，正在自动启动..."
            nohup sh -c "__START_CMD__" > /tmp/server.log 2>&1 &
            sleep 5
        fi
    fi

    for i in $(seq 1 15); do
        if curl -sf http://127.0.0.1:__PORT__/__HEALTH__ > /dev/null 2>&1; then
            echo "  ✅ 服务就绪"
            break
        fi
        sleep 2
        [ "$i" -eq 15 ] && echo "  ❌ 服务不可达" && exit 1
    done
    echo ""

    # [COMPLIANCE CHECK: exec_exp]
    echo "━━━ 运行 exp.sh ━━━"
    bash /tmp/exp.sh
    echo ""

    # [COMPLIANCE CHECK: evidence_check]
    if [ -f /tmp/exp_output ] && [ -s /tmp/exp_output ]; then
        echo "✅ PoC 执行成功"
        cat /tmp/exp_output
    else
        echo "❌ PoC 执行未完成"
        exit 1
    fi
    echo ""

    # [COMPLIANCE CHECK: end_marker]
    echo "验证完成"

  end_marker: "展示 PoC 关键输出"

inject_on_write:
  verify.sh:
    pre_check: |
      🔴 你即将写入 verify.sh。目标类型: other（基本复现）。写入前必须确认：

      1. 开头执行 bash /tmp/exp.sh 触发 PoC
      2. 展示 PoC 关键输出（能证明漏洞存在的行），用 ✅/❌ 标记结果
      3. 不使用 set -e
      4. 最后一行严格展示 PoC 验证结果，禁止在末尾追加额外 exit/echo/空行

    post_check: |
      🔴 verify.sh 写入完成。现在立即 read_file 读回该文件，逐条自检：

      1. 是否执行了 bash /tmp/exp.sh？□
         → 如果没有 → 用 write_file 重写
      2. 是否展示了 PoC 关键输出并带有 ✅/❌ 标记？□
         → 如果没有 → 用 write_file 重写
      3. 是否有 set -e？□
         → 如果有 → 删除，用 write_file 重写
      4. 末尾是否有额外空行/exit/echo 在结果之后？□
         → 如果有 → 删除，用 write_file 重写

      🔴 任一 □ 打叉 → 立即重写。全部通过后才能继续下一步。

      7. `bash -n` 语法检查是否通过？□
         → 如果不通过 → 修正语法错误，用 write_file 重写

  exp.sh:
    pre_check: |
      🔴 你即将写入 exp.sh。目标类型: other（基本复现）。写入前必须确认：

      1. 不使用 set -e，清理命令加 2>/dev/null || true
      2. 编译噪声用 2>/dev/null 屏蔽，只保留 PoC 关键输出
      3. 最后一行输出严格等于 EXP 完成

    post_check: |
      🔴 exp.sh 写入完成。现在立即 read_file 读回该文件，逐条自检：

      1. 是否有 set -e？□
         → 如果有 → 删除，用 write_file 重写
      2. 最后一行是否输出 EXP 完成？□
         → 如果不是或为裸文本 → 改为 echo "EXP 完成"，用 write_file 重写

      🔴 任一 □ 打叉 → 立即重写。全部通过后才能继续下一步。

      7. `bash -n` 语法检查是否通过？□
         → 如果不通过 → 修正语法错误，用 write_file 重写

      10. exp.sh 开头是否清理了 CVE_WORKDIR 工作空间？□
         → 如果没有 → 在开头加 rm -rf "$CVE_WORKDIR" && mkdir -p "$CVE_WORKDIR"，用 write_file 重写
      11. 如果 exp.sh 包含编译命令（go build/gcc/mvn），是否用 background=True 启动而非 timeout 等待？□
         → 如果是同步编译 → 改为 background=True 启动 + 轮询检查二进制
files: []

checks:
  - name: "exp.sh 能够运行且以 EXP 完成 结尾"
    on_fail: "确保 exp.sh 正常运行并在最后输出 EXP 完成"
  - name: "verify.sh 运行了 exp.sh 并展示了验证结果"
    on_fail: "确保 verify.sh 开头 bash /tmp/exp.sh，结尾展示关键结果和 ✅/❌ 标记"
  - name: "verify.sh 最后一行严格等于 end_marker（展示 PoC 关键输出），无多余 exit/echo/空行"
    on_fail: "删除 verify.sh 末尾多余的 exit/echo/空行，确保最后一行是展示 PoC 输出的实际内容"
