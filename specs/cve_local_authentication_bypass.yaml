# CVE 复现 — 本地认证绕过（OS 层屏障：sudo、PAM、polkit）
target_type: local_authentication_bypass
label: "本地认证绕过"
attack_surface: local

# 容器运行时配置（框架读取，不依赖 agent）
container:
  entrypoint_mode: "sleep"
  requires_startup: false

type_instruction: |
  【认证绕过模式】用户选择认证绕过目标。目标是证明无需有效凭据
  即可访问受保护资源。验收标准：越权访问成功。

acceptance: |
  ## 认证绕过验收标准

  认证绕过漏洞复现必须达到：**攻击者无需凭据即可访问受保护资源**。

  **通用步骤：**
  1. 搭建受影响版本的目标服务
  2. 构造绕过认证的请求/操作
  3. 本地认证绕过验证完成

exp_sh:
  header: |
    ### 1. exp.sh — 漏洞利用（认证绕过）
    负责触发漏洞并展示越权访问。
  sections:
    - title: "通用规则"
      rules:
        - "不使用 set -e，清理命令加 2>/dev/null || true"
        - "输出以 EXP 完成 结尾"
        - "展示越权访问前后对比"

verify_sh:
  header: |
    ### 2. verify.sh — 一键验证脚本
    运行 exp.sh 并展示越权结果。可反复运行。
  sections:
    - title: "开头 — 运行 exp.sh"
      text: "运行 exp.sh: bash /tmp/exp.sh"
    - title: "结尾 — 展示越权结果"
      text: |
        展示越权访问确认信息。
        用 ✅/❌ 标记验证结果。
  skeleton: |
    #!/bin/sh

    # [COMPLIANCE CHECK: precondition]
    echo "━━━ [前置检查] 服务可用性 ━━━"

    # 自动启动（Agent 替换 __START_CMD__ 后生效，未替换则跳过）
    if ! curl -sf http://127.0.0.1:__PORT__/__HEALTH__ > /dev/null 2>&1; then
        if [ "__START_CMD__" != "__START_CMD__" ]; then
            echo "  ⚠️ 服务未运行，正在自动启动..."
            nohup sh -c "__START_CMD__" > /tmp/server.log 2>&1 &
            sleep 5
        fi
    fi

    for i in $(seq 1 15); do
        if curl -sf http://127.0.0.1:__PORT__/__HEALTH__ > /dev/null 2>&1; then
            echo "  ✅ 服务就绪"
            break
        fi
        sleep 2
        [ "$i" -eq 15 ] && echo "  ❌ 服务不可达" && exit 1
    done
    echo ""

    # [COMPLIANCE CHECK: barrier]
    echo "━━━ [阶段 1/3] 权限屏障 ━━━"
    BARRIER_CODE=$(curl -s -o /dev/null -w "%{http_code}" __BARRIER_URL__)
    if [ "$BARRIER_CODE" = "401" ] || [ "$BARRIER_CODE" = "403" ]; then
        echo "  ✅ 屏障正常 — HTTP $BARRIER_CODE"
    else
        echo "  ⚠️  屏障异常 — HTTP $BARRIER_CODE"
    fi
    echo ""

    # [COMPLIANCE CHECK: exec_exp]
    echo "━━━ 运行 exp.sh ━━━"
    bash /tmp/exp.sh
    EXP_EXIT=$?
    echo ""

    # [COMPLIANCE CHECK: evidence_check]
    if [ "$EXP_EXIT" -eq 0 ]; then
        echo "✅ 绕过确认"
    else
        echo "❌ 绕过未确认"
        exit 1
    fi
    echo ""

    # [COMPLIANCE CHECK: end_marker]
    echo "验证完成"

  end_marker: "本地认证绕过验证完成"

readme_chapters:
  - name: "快速验证"
    desc: "🔴 验证命令: `docker exec -u attacker <容器> bash /tmp/verify.sh`。带预期输出最后 5 行。"

files:
  - name: exp.sh
    desc: "漏洞利用（认证绕过）"
    category: exploit
    end_marker: "EXP 完成"
    rules:
      - "不使用 set -e"
      - "本地认证绕过验证完成"
      - "输出以 EXP 完成 结尾"

  - name: verify.sh
    desc: "验证脚本"
    category: verify
    end_marker: "本地认证绕过验证完成"
    rules:
      - "开头运行 bash /tmp/exp.sh"
      - "展示越权访问确认"
      - "用 ✅/❌ 标记验证结果"

inject_on_write:
  verify.sh:
    pre_check: |
      🔴 你即将写入 verify.sh。目标类型: local_authentication_bypass。写入前必须确认：

      1. 开头执行 bash /tmp/exp.sh
      2. 本地认证绕过验证完成，用 ✅/❌ 标记验证结果
      3. 不使用 set -e
      4. 最后一行展示越权访问确认（如 echo 或 cat 越权结果）

    post_check: |
      🔴 verify.sh 写入完成。现在立即 read_file 读回该文件，逐条自检：

      1. 是否执行了 bash /tmp/exp.sh？□
         → 如果没有 → 用 write_file 重写
      2. 是否展示了越权访问结果？□
         → 如果没有 → 用 write_file 重写
      3. 是否有 set -e？□
         → 如果有 → 删除，用 write_file 重写
      4. 是否有 ✅/❌ 标记？□
         → 如果没有 → 用 write_file 重写

      🔴 任一 □ 打叉 → 立即重写。全部通过后才能继续下一步。

      7. `bash -n` 语法检查是否通过？□
         → 如果不通过 → 修正语法错误，用 write_file 重写

  exp.sh:
    pre_check: |
      🔴 你即将写入 exp.sh。目标类型: local_authentication_bypass。写入前必须确认：

      1. 不使用 set -e，清理命令加 2>/dev/null || true
      2. 展示越权访问前后对比
      3. 最后一行必须是 echo "EXP 完成"（禁止裸文本，bash 会当命令执行）

    post_check: |
      🔴 exp.sh 写入完成。现在立即 read_file 读回该文件，逐条自检：

      1. 是否有 set -e？□
         → 如果有 → 删除，用 write_file 重写
      2. 最后一行是否严格等于 EXP 完成？□
         → 如果不是或为裸文本 → 改为 echo "EXP 完成"，用 write_file 重写
      3. 是否展示了越权访问的前后对比？□
         → 如果没有 → 用 write_file 重写

      🔴 任一 □ 打叉 → 立即重写。全部通过后才能继续下一步。

      7. `bash -n` 语法检查是否通过？□
         → 如果不通过 → 修正语法错误，用 write_file 重写

      10. exp.sh 开头是否清理了 CVE_WORKDIR 工作空间？□
         → 如果没有 → 在开头加 rm -rf "$CVE_WORKDIR" && mkdir -p "$CVE_WORKDIR"，用 write_file 重写
      11. 如果 exp.sh 包含编译命令（go build/gcc/mvn），是否用 background=True 启动而非 timeout 等待？□
         → 如果是同步编译 → 改为 background=True 启动 + 轮询检查二进制
checks:
  - name: "exp.sh 成功绕过认证并展示了越权访问结果，最后一行是 EXP 完成"
    on_fail: "确保 exp.sh 展示越权访问确认，最后一行严格等于 EXP 完成"
  - name: "verify.sh 最后一行严格等于 end_marker（展示越权结果），无多余 exit/echo/空行"
    on_fail: "删除 verify.sh 末尾多余的 exit/echo/空行，确保最后一行是本地认证绕过验证完成的实际输出"
