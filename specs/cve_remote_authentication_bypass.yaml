# CVE 复现 — 远程认证绕过（应用层屏障：JWT、OAuth、Session、API Key）
target_type: remote_authentication_bypass
label: "远程认证绕过"
attack_surface: remote

# 容器运行时配置（框架读取，不依赖 agent）
container:
  entrypoint_mode: "cmd"
  requires_startup: true

# verify.sh 自启动配置
startup:
  port: 8080
  health: "/"
  cmd: ""

type_instruction: |
  【远程认证绕过模式】用户选择远程认证绕过目标。证明无需有效凭据
  即可通过网络请求访问受保护资源。屏障在应用层（JWT、OAuth、
  Session Cookie、API Key），不在 OS 层。验收标准：越权访问成功。
  
  🔴 此 CVE 类型涉及 Web/网络服务，使用 docker_setup 时请传 entrypoint_mode="cmd"（保留 Dockerfile CMD 自动启动服务），
  并视需要传 port_mappings 暴露端口（如 port_mappings=["3001:3001"]）。

acceptance: |
  ## 远程认证绕过验收标准

  远程认证绕过漏洞复现必须达到：**攻击者无需有效凭据即可通过网络
  访问受保护的应用资源**。

  **二段式验证（verify.sh 必须按此顺序执行）：**

  ### 阶段 1：认证屏障
  展示正常请求（无凭据/无效凭据）被应用层拒绝（401/403），
  证明资源受认证保护。
  🔴 不要用 whoami/id/sudo——这些是 OS 层检查，对远程认证绕过无意义。

  ### 阶段 2：绕过验证
  运行 exp.sh 触发认证绕过，展示绕过后的越权访问结果。

exp_sh:
  header: |
    ### 1. exp.sh — 漏洞利用（远程认证绕过）
    负责触发漏洞并展示越权访问。
  sections:
    - title: "通用规则"
      rules:
        - "不使用 set -e，清理命令加 2>/dev/null || true"
        - "输出以 EXP 完成 结尾"
        - "展示越权访问前后对比"

verify_sh:
  header: |
    ### 2. verify.sh — 一键验证脚本
    exp.sh 通过 env.sh 启动服务后执行绕过逻辑，verify.sh 直接调用并验证结果。
  sections:
    - title: "运行 exp.sh"
      text: |
        exp.sh 负责启动服务、展示认证屏障、执行绕过。
        ⚠️ 这是 verify.sh 的第一步。exp.sh 会启动服务并完成绕过演示。
        所有 curl 检查（包括 barrier check）必须在服务启动之后执行。
        如果先做 barrier check 再做 exp.sh，必须在 barrier 前加服务就绪检查。
      code: |
        echo "============================================"
        echo "  CVE-XXXX-XXXXX 远程认证绕过验证"
        echo "============================================"
        echo ""
        echo "━━━ 运行 exp.sh ━━━"
        bash /tmp/exp.sh
        echo ""
    - title: "验证绕过结果"
      text: |
        确认越权访问成功：
      code: |
        echo "━━━ 绕过验证结果 ━━━"
        echo "  远程认证绕过确认 — 越权访问成功"
        echo "============================================"
  skeleton: |
    #!/bin/sh

    # [COMPLIANCE CHECK: precondition]
    echo "━━━ [前置检查] 服务可用性 ━━━"

    # 自动启动（Agent 替换 __START_CMD__ 后生效，未替换则跳过）
    if ! curl -sf http://127.0.0.1:__PORT__/__HEALTH__ > /dev/null 2>&1; then
        if [ "__START_CMD__" != "__START_CMD__" ]; then
            echo "  ⚠️ 服务未运行，正在自动启动..."
            nohup sh -c "__START_CMD__" > /tmp/server.log 2>&1 &
            sleep 5
        fi
    fi

    for i in $(seq 1 15); do
        if curl -sf http://127.0.0.1:__PORT__/__HEALTH__ > /dev/null 2>&1; then
            echo "  ✅ 服务就绪"
            break
        fi
        sleep 2
        [ "$i" -eq 15 ] && echo "  ❌ 服务不可达" && exit 1
    done
    echo ""

    # [COMPLIANCE CHECK: barrier]
    echo "━━━ [阶段 1/3] 权限屏障 ━━━"
    BARRIER_CODE=$(curl -s -o /dev/null -w "%{http_code}" __BARRIER_URL__)
    if [ "$BARRIER_CODE" = "401" ] || [ "$BARRIER_CODE" = "403" ]; then
        echo "  ✅ 屏障正常 — HTTP $BARRIER_CODE"
    else
        echo "  ⚠️  屏障异常 — HTTP $BARRIER_CODE"
    fi
    echo ""

    # [COMPLIANCE CHECK: exec_exp]
    echo "━━━ 运行 exp.sh ━━━"
    bash /tmp/exp.sh
    EXP_EXIT=$?
    echo ""

    # [COMPLIANCE CHECK: evidence_check]
    if [ "$EXP_EXIT" -eq 0 ]; then
        echo "✅ 绕过确认"
    else
        echo "❌ 绕过未确认"
        exit 1
    fi
    echo ""

    # [COMPLIANCE CHECK: end_marker]
    echo "验证完成"

  end_marker: "远程认证绕过验证完成"

files:
  - name: exp.sh
    desc: "漏洞利用（远程认证绕过）"
    category: exploit
    end_marker: "EXP 完成"
    rules:
      - "不使用 set -e"
      - "远程认证绕过验证完成"
      - "输出以 EXP 完成 结尾"

  - name: verify.sh
    desc: "验证脚本（二段式）"
    category: verify
    end_marker: "远程认证绕过验证完成"
    rules:
      - "第一步执行 bash /tmp/exp.sh（env.sh 负责启动服务，exp.sh 负责执行绕过）"
      - "验证绕过结果，用 curl 确认越权访问，不要用 whoami"
      - "用 ✅/❌ 标记验证结果"

inject_on_write:
  verify.sh:
    pre_check: |
      🔴 你即将写入 verify.sh。目标类型: remote_authentication_bypass。写入前必须确认：

      1. 第一步执行 bash /tmp/exp.sh（env.sh 负责启动服务，exp.sh 负责执行绕过）
      2. exp.sh 运行后验证绕过结果（确认越权访问成功）
      3. 🔴 不需要 like whoami/id/sudo —— 用 curl 验证
      4. 不使用 set -e
      5. 用 ✅/❌ 标记验证结果

    post_check: |
      🔴 verify.sh 写入完成。现在立即 read_file 读回该文件，逐条自检：

      1. 是否第一步执行了 bash /tmp/exp.sh？□
         → 如果没有 → 用 write_file 重写
      2. 是否展示了越权访问确认？□
         → 如果没有 → 用 write_file 重写
      3. 是否有 set -e？□
         → 如果有 → 删除，用 write_file 重写
      4. 是否用 curl 而非 whoami？□
         → 如果出现 whoami/id/sudo → 用 write_file 重写

      🔴 任一 □ 打叉 → 立即重写。全部通过后才能继续下一步。

      7. `bash -n` 语法检查是否通过？□
         → 如果不通过 → 修正语法错误，用 write_file 重写

  exp.sh:
    pre_check: |
      🔴 你即将写入 exp.sh。目标类型: remote_authentication_bypass。写入前必须确认：

      1. 不使用 set -e，清理命令加 2>/dev/null || true
      2. 展示越权访问前后对比
      3. 最后一行必须是 echo "EXP 完成"（禁止裸文本，bash 会当命令执行）

    post_check: |
      🔴 exp.sh 写入完成。现在立即 read_file 读回该文件，逐条自检：

      1. 是否有 set -e？□
         → 如果有 → 删除，用 write_file 重写
      2. 最后一行是否严格等于 EXP 完成？□
         → 如果不是或为裸文本 → 改为 echo "EXP 完成"，用 write_file 重写
      3. 是否展示了越权访问的前后对比？□
         → 如果没有 → 用 write_file 重写

      🔴 任一 □ 打叉 → 立即重写。全部通过后才能继续下一步。

      7. `bash -n` 语法检查是否通过？□
         → 如果不通过 → 修正语法错误，用 write_file 重写

      10. exp.sh 开头是否清理了 CVE_WORKDIR 工作空间？□
         → 如果没有 → 在开头加 rm -rf "$CVE_WORKDIR" && mkdir -p "$CVE_WORKDIR"，用 write_file 重写
      11. 如果 exp.sh 包含编译命令（go build/gcc/mvn），是否用 background=True 启动而非 timeout 等待？□
         → 如果是同步编译 → 改为 background=True 启动 + 轮询检查二进制
checks:
  - name: "exp.sh 成功绕过认证并展示了越权访问结果，最后一行是 EXP 完成"
    on_fail: "确保 exp.sh 展示越权访问确认，最后一行严格等于 EXP 完成"
  - name: "verify.sh 阶段 1 展示了认证屏障（curl 401/403），未使用 whoami/id"
    on_fail: "在 verify.sh 阶段 1 用 curl 展示认证屏障，不要用 whoami/id"
  - name: "verify.sh 最后一行严格等于 end_marker，无多余 exit/echo/空行"
    on_fail: "删除 verify.sh 末尾多余的 exit/echo/空行"
