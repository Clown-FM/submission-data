# CVE 复现 — 跨站脚本（XSS：反射型 / 存储型 / DOM-based）
target_type: xss
label: "跨站脚本（XSS）"
attack_surface: remote

# 容器运行时配置（框架读取，不依赖 agent）
container:
  entrypoint_mode: "cmd"
  requires_startup: true

# verify.sh 自启动配置
startup:
  port: 8080
  health: "/"
  cmd: ""
suggested_docker_image: exppilot-xss

type_instruction: |
  【XSS 模式】漏洞核心是用户输入未正确转义/过滤，导致可在浏览器中执行恶意脚本。
  使用单容器架构，基础镜像 exppilot-xss 已预装 node + puppeteer-core + google-chrome-stable。

  验证方式（分层）：
  - Level 0: curl 发送含 <script>alert(1)</script> 的请求，检查响应中是否未经转义返回
  - Level 1+: 用 puppeteer-core 打开页面（或导航到含恶意内容的页面），检测 alert/dialog 是否被触发

  XSS 三种类型的引导：

  1. **反射型** — payload 在 URL/参数中，服务端直接反射到响应
     → curl 发送 payload → puppeteer 打开反射页面 → 监听到 dialog

  2. **存储型** — payload 存储在服务端（数据库），在管理页面渲染
     → curl 登录获取 cookie → puppeteer 注入 cookie → 导航到触发页面 → 监听到 dialog

  3. **DOM-based / Mutation** — payload 在客户端通过 DOM 操作执行（如编辑器、sanitizer）
     → 部署含漏洞的页面（如 Trix 编辑器）→ puppeteer 注入/粘贴 payload → 确认 JS 执行
     → 如果是编辑器类 CVE，先 npm install 对应版本的包，然后创建测试 HTML 页面

  注意：verify.sh 在容器内运行，不需要攻击者容器，单容器架构。

  ## 🔴 存储型 XSS（需登录访问管理页面的场景）

  如果 XSS payload 存储在服务端（数据库），需要通过管理后台页面触发：

  1. **先获取登录 cookie**：curl -c cookies.txt -d "username=xxx&password=xxx" http://host/login_check.php
  2. **提取 session ID**：从 cookie 文件中提取（注意 PHP session_regenerate_id 会更换 session ID，必须直接 POST 到登录处理端点获取最终 ID）
  3. **Puppeteer 注入 cookie**：await page.setCookie({name:'PHPSESSID', value:sessionId, domain:'localhost', path:'/'})
  4. **导航到管理页面**：payload 在管理页面渲染（如设备管理、用户管理等）
  5. **监听 alert dialog + 检查 HTML 中未转义的 script 标签**

  如果有必要，先用 curl 重置管理员密码（"admin123"），确保登录凭据可用。
  
  🔴 此 CVE 类型涉及 Web/网络服务，使用 docker_setup 时请传 entrypoint_mode="cmd"（保留 Dockerfile CMD 自动启动服务），
  并视需要传 port_mappings 暴露端口（如 port_mappings=["3001:3001"]）。

acceptance: |
  ## 反射型 XSS 验收标准

  反射型 XSS 验证通过以下对比确认：

  ━━ [1/3] 正常请求（无 payload）━━
  curl 正常参数 → 页面正常返回  ✅

  ━━ [2/3] 恶意请求（含 script payload）━━
  curl payload=<script>alert(1)</script> → 响应中包含未经转义的 <script> 标签  ❌

  ━━ [3/3] 结论 ━━
  对比确认输入未转义直接输出到 HTML 中，存在反射型 XSS 漏洞。

  Level 1（必须）：puppeteer-core 无头浏览器加载页面，监听 dialog 事件确认 JS 执行。
  镜像已预装 puppeteer-core + google-chrome-stable，node 脚本可直接使用。
  注意：require('puppeteer-core') 不是 puppeteer，executablePath 指向 /usr/bin/google-chrome-stable。

exp_sh:
  header: |
    ### 1. exp.sh — 漏洞利用（在容器内运行）
    启动漏洞服务（如果 CVE 需要），构造 XSS payload，curl 发送请求确认反射。
    运行方式：`docker exec <容器> bash /tmp/exp.sh`
  sections:
    - title: "通用规则"
      rules:
        - "🔴 exp.sh 必须是 bash 脚本（#!/bin/bash），禁止用 Python 或其他语言"
        - "不使用 set -e，清理命令加 2>/dev/null || true"
        - "单容器架构，不涉及双容器网络"
        - "末尾输出 exp.sh 完成"

verify_sh:
  header: |
    ### 2. verify.sh — 一键验证脚本（在同一容器内运行）
    发送正常请求和 XSS payload 请求，对比响应判断 XSS 是否存在。
    运行方式：`docker exec <容器> bash /tmp/verify.sh`
  sections:
    - title: "━━━ [1/3] 正常请求 ━━━"
      text: "发送不含 payload 的正常请求，确认服务正常"
    - title: "━━━ [2/3] XSS 验证（curl + puppeteer-core）━━━"
      text: |
        1. curl 发送含 XSS payload 的请求，检查是否未经转义返回
        2. puppeteer-core 打开页面，监听 alert dialog 确认 JS 执行
        3. 如果目标需要登录，先在 Step 2 开头用 curl 登录获取 session cookie
    - title: "━━━ [3/3] 结论 ━━━"
      text: "对比两个请求的响应差异，并结合 puppeteer dialog 结果，判断 XSS 是否存在"
  skeleton: |
    #!/bin/sh

    # [COMPLIANCE CHECK: precondition]
    echo "━━━ [前置检查] 服务可用性 ━━━"

    # 自动启动（Agent 替换 __START_CMD__ 后生效，未替换则跳过）
    if ! curl -sf http://127.0.0.1:__PORT__/__HEALTH__ > /dev/null 2>&1; then
        if [ "__START_CMD__" != "__START_CMD__" ]; then
            echo "  ⚠️ 服务未运行，正在自动启动..."
            nohup sh -c "__START_CMD__" > /tmp/server.log 2>&1 &
            sleep 5
        fi
    fi

    for i in $(seq 1 15); do
        if curl -sf http://127.0.0.1:__PORT__/__HEALTH__ > /dev/null 2>&1; then
            echo "  ✅ 服务就绪"
            break
        fi
        sleep 2
        [ "$i" -eq 15 ] && echo "  ❌ 服务不可达" && exit 1
    done
    echo ""

    # [COMPLIANCE CHECK: barrier]
    echo "━━━ [阶段 1/3] 权限屏障 ━━━"
    BARRIER_CODE=$(curl -s -o /dev/null -w "%{http_code}" __BARRIER_URL__)
    if [ "$BARRIER_CODE" = "401" ] || [ "$BARRIER_CODE" = "403" ]; then
        echo "  ✅ 屏障正常 — HTTP $BARRIER_CODE"
    else
        echo "  ⚠️  屏障异常 — HTTP $BARRIER_CODE"
    fi
    echo ""

    # [COMPLIANCE CHECK: exec_exp]
    echo "━━━ 运行 exp.sh ━━━"
    bash /tmp/exp.sh
    EXP_EXIT=$?
    echo ""

    # [COMPLIANCE CHECK: evidence_check]
    if [ "$EXP_EXIT" -eq 0 ]; then
        echo "✅ 绕过确认"
    else
        echo "❌ 绕过未确认"
        exit 1
    fi
    echo ""

    # [COMPLIANCE CHECK: end_marker]
    echo "验证完成"

  end_marker: "echo 'XSS 验证完成'"

inject_on_write:
  verify.sh:
    pre_check: |
      🔴 你即将写入 verify.sh。目标类型: xss。写入前必须确认：

      1. 使用单容器架构（不需要攻击者容器）
      2. 验证思路：正常请求 → 不转义 → puppeteer-core 确认
      3. 不使用 set -e
      4. 基础镜像 exppilot-xss，容器中有 node + puppeteer-core + google-chrome-stable
      5. 🔴 必须包含 puppeteer-core 验证段（node 脚本），不只是 curl
      6. 🔴 Puppeteer 脚本必须用 puppeteer-core（require('puppeteer-core')），executablePath 指向 /usr/bin/google-chrome-stable
      7. 🔴 存储型 XSS 需要先 curl 登录获取 session cookie，用 page.setCookie() 注入后再导航到管理页面

    post_check: |
      🔴 verify.sh 写入完成。现在立即 read_file 读回该文件，逐条自检：

      1. 是否有正常的请求（不带 payload）对比？□
         → 如果没有 → 用 write_file 重写
      2. 是否有含 script payload 的恶意请求？□
         → 如果没有 → 用 write_file 重写
      3. 是否有对比结论输出？□
         → 如果没有 → 用 write_file 重写
      4. 最后一行是否以 'XSS 验证完成' 结尾？□
         → 如果不是 → 用 write_file 重写
      5. 🔴 是否有 puppeteer-core 验证段（require('puppeteer-core'), dialog 监听）？□
         → 如果没有 → 用 write_file 重写
      6. 是否用了 puppeteer 而不是 puppeteer-core？□
         → 如果是 → 改为 puppeteer-core，executablePath: '/usr/bin/google-chrome-stable'，用 write_file 重写
      7. 是否有 set -e？□
         → 如果有 → 删除，用 write_file 重写
      8. verify.sh 中是否包含 docker exec（攻击者容器内不可用）？□
         → 如果有 → 删除，用 write_file 重写
      9. 🔴 存储型 XSS：Puppeteer 脚本是否先注入 session cookie 再导航到管理页面？□
         → 如果不是（导航到了无内容的首页）→ 改用管理页面 URL 或登录后 cookie 注入方式，用 write_file 重写
      10. 🔴 Puppeteer executablePath 是否指向 /usr/bin/google-chrome-stable？□
          → 如果是 /usr/bin/chromium-browser → 改回 google-chrome-stable，用 write_file 重写

      🔴 任一 □ 打叉 → 立即重写。全部通过后才能继续下一步。

      7. `bash -n` 语法检查是否通过？□
         → 如果不通过 → 修正语法错误，用 write_file 重写

  exp.sh:
    pre_check: |
      🔴 你即将写入 exp.sh。目标类型: xss。写入前必须确认：

      1. 第一行是 #!/bin/bash
      2. 构造的 payload 必须包含 <script>alert(1)</script> 或等效的 XSS 向量
      3. 不使用 set -e
      4. 末尾输出 exp.sh 完成

    post_check: |
      🔴 exp.sh 写入完成。现在立即 read_file 读回该文件，逐条自检：

      1. 第一行是否是 #!/bin/bash？□
         → 如果不是 → 用 write_file 重写
      2. 是否构造了包含 <script> 的 XSS payload？□
         → 如果没有 → 用 write_file 重写
      3. 是否发送了含 payload 的请求并验证响应？□
         → 如果没有 → 用 write_file 重写
      4. 是否有 set -e？□
         → 如果有 → 删除，用 write_file 重写

      🔴 任一 □ 打叉 → 立即重写。全部通过后才能继续下一步。

checks:
  - name: "verify.sh 最后一行包含 'XSS 验证完成'"
    on_fail: "确保 verify.sh 末尾输出 'XSS 验证完成'"
  - name: "verify.sh 中有正常请求和恶意请求的对比"
    on_fail: "确保 verify.sh 包含两组请求的对比（正常 vs payload）"
  - name: "🔴 Puppeteer 段用 puppeteer-core（require('puppeteer-core')），不是 puppeteer"
    on_fail: "将 require('puppeteer') 改为 require('puppeteer-core')，添加 executablePath: '/usr/bin/google-chrome-stable'"
  - name: "🔴 verify.sh 中 google-chrome-stable 可用（非 snap wrapper）"
    on_fail: "Ubuntu 22.04 的 chromium-browser 是 snap 占位包不可用，必须用 google-chrome-stable（apt 或 wget 安装）"

  # 存储型 XSS 专用检查
  - name: "🔴 [存储型] Dockerfile 处理了 PHP 版本兼容性（如果目标是 PHP 应用）"
    on_fail: "(phpipam 等旧 PHP 应用需要) 在 config.php 追加 $allow_untested_php_versions = true; 并安装 php-pear"
  - name: "🔴 [存储型] Puppeteer 脚本注入 session cookie 后再导航，不直接访问首页"
    on_fail: "存储型 XSS 需 curl 登录 → 提取 session → setCookie → 导航到管理页面"
