# CVE 复现 — 本地信息泄露（OS 层屏障：文件权限、内核内存）
target_type: local_information_disclosure
label: "本地信息泄露"
attack_surface: local

# 容器运行时配置（框架读取，不依赖 agent）
container:
  entrypoint_mode: "sleep"
  requires_startup: false

type_instruction: |
  【信息泄露模式】用户选择信息泄露目标。证明非特权用户可读取
  通常不可访问的敏感数据。验收标准：展示泄露的敏感数据，并**评估
  该数据的实际危害**（如：凭据泄露可导致数据库被访问、密钥泄露可
  伪造令牌、源码泄露暴露业务逻辑等）。

acceptance: |
  ## 信息泄露验收标准

  信息泄露漏洞复现必须达到：**非特权用户成功读取受限数据，并且能
  清楚说明这些数据在不同场景下可能被利用**。

  ## 三段式验证（verify.sh 必须按此顺序执行）

  ### 阶段 1：身份与权限屏障
  展示当前用户身份（whoami, id），并展示目标文件的权限，
  证明该资源**本应**无法被当前用户访问。

  ### 阶段 2：泄露内容展示
  运行 exp.sh 触发漏洞，收集泄露数据到 /tmp/leaked_data。
  用 head（≤15 行）展示泄露内容的关键部分。

  ### 阶段 3：影响评估
  扫描 /tmp/leaked_data 中的敏感信息类型（凭据/密钥/令牌/源码/PII），
  用 🚨 图标标注发现的高危项，并用一句话说明每项的实际危害。
  严禁编造不存在的凭据或危害。

exp_sh:
  header: |
    ### 1. exp.sh — 漏洞利用（信息窃取）
    负责触发漏洞并收集泄露的敏感数据。不做提权、不创建 bind shell。
  sections:
    - title: "通用规则"
      rules:
        - "🔴 exp.sh 必须是 bash 脚本（#!/bin/bash），禁止用 Python 或其他语言"
        - "不使用 set -e，清理命令加 2>/dev/null || true"
        - "🔴 exp.sh 只做两件事：① 触发漏洞读取受限数据 ② 写入 /tmp/leaked_data"
        - "exp.sh 负责启动目标服务并等待就绪，再触发漏洞（如本地服务需先启动再攻击）"
        - "泄漏的数据写入 /tmp/leaked_data"
        - "末尾输出 泄露数据已收集 并展示文件大小（wc -c）"
    - title: "数据收集规范"
      rules:
        - "泄露数据保存到 /tmp/leaked_data，不做截断"
        - "如果漏洞需要分多次读取（如按行/按偏移），合并到 /tmp/leaked_data"
        - "如果目标文件不存在（如 .env 路径不同），尝试常见变体并记录尝试过程"
        - "用 grep 过滤掉二进制噪声（如内存泄露场景），只保留可读文本"

verify_sh:
  header: |
    ### 2. verify.sh — 一键验证脚本
    按三段式执行：身份屏障 → 泄露内容 → 影响评估。可反复运行。
  sections:
    - title: "阶段 1 — 身份与权限屏障"
      text: |
        展示当前用户不是 root，且目标资源本应受保护：
      code: |
        echo "============================================"
        echo "  CVE-XXXX-XXXXX 信息泄露验证"
        echo "============================================"
        echo ""
        echo "━━━ [阶段 1/3] 身份与权限屏障 ━━━"
        echo "当前用户: $(whoami) (uid=$(id -u))"
        echo "所属组: $(id -gn)"
        echo ""
        echo "[权限检查] 受保护资源："
        # Agent 根据实际目标文件替换 PATH
        TARGET=<受保护的文件/资源路径>
        ls -l "$TARGET" 2>/dev/null && echo "  ↑ 该文件仅限特权用户访问" || echo "  (资源为远程/非文件形式)"
    - title: "阶段 2 — 泄露内容展示"
      text: |
        运行 exp.sh 触发漏洞，展示泄露数据：
      code: |
        echo ""
        echo "━━━ [阶段 2/3] 泄露内容展示 ━━━"
        bash /tmp/exp.sh

        if [ -f /tmp/leaked_data ] && [ -s /tmp/leaked_data ]; then
            echo ""
            LEAKED_SIZE=$(wc -c < /tmp/leaked_data)
            echo "✅ 信息泄露确认 — 成功读取 ${LEAKED_SIZE} 字节的受限数据"
            echo ""
            echo "--- 泄露内容预览（前 15 行）---"
            head -15 /tmp/leaked_data
            echo ""
        else
            echo "❌ 未检测到泄露数据"
            exit 1
        fi
    - title: "阶段 3 — 影响评估"
      text: |
        扫描泄露内容中的敏感信息类型，标注高危项：
      code: |
        echo "━━━ [阶段 3/3] 影响评估 ━━━"
        echo ""
        LEAKED=$(cat /tmp/leaked_data)

        # 逐项检测敏感信息类型（纯文本分析，不做网络请求）
        FOUND=0

        if echo "$LEAKED" | grep -qiE "(password|passwd|pwd)\s*[=:]\s*\S+"; then
            echo "🚨 明文凭据 — 可能被用于直接登录目标系统"
            FOUND=1
        fi
        if echo "$LEAKED" | grep -qiE "(secret|SECRET)\s*[=:]\s*\S+"; then
            echo "🚨 密钥/Secret — 可能被用于伪造签名或解密敏感数据"
            FOUND=1
        fi
        if echo "$LEAKED" | grep -qiE "-----BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----"; then
            echo "🚨 私钥 — 可能被用于免密 SSH 登录或身份冒充"
            FOUND=1
        fi
        if echo "$LEAKED" | grep -qiE "(api[_-]?key|token|bearer)\s*[=:]\s*\S+"; then
            echo "🚨 API 密钥/Token — 可能被用于调用受保护的 API 接口"
            FOUND=1
        fi
        if echo "$LEAKED" | grep -qiE "(jwt[_-]?secret|jwt[_-]?key|signing[_-]?key)"; then
            echo "🚨 JWT 签名密钥 — 可能被用于伪造任意用户的认证令牌"
            FOUND=1
        fi
        if echo "$LEAKED" | grep -qiE "(database|db|mysql|postgres|redis|mongodb|mongo)[^=]*://[^ ]+"; then
            echo "🚨 数据库连接串 — 包含主机、端口、凭据，可直接连接数据库"
            FOUND=1
        fi
        if echo "$LEAKED" | grep -qiE "@(gmail|yahoo|outlook|qq|163)"; then
            echo "⚠️  邮箱地址 — 可能被用于钓鱼攻击或账号恢复"
            FOUND=1
        fi
        if echo "$LEAKED" | grep -qiE "\b\d{13,19}\b"; then
            echo "⚠️  疑似卡号/证件号 — 可能造成个人信息泄露"
            FOUND=1
        fi

        if [ "$FOUND" -eq 0 ]; then
            echo "ℹ️  未检测到已知敏感模式，但该数据的非授权访问本身已构成安全事件"
            echo "   泄露数据大小: $(wc -c < /tmp/leaked_data) 字节"
        fi

        echo ""
        echo "============================================"
        echo "  本地信息泄露验证完成"
        echo "============================================"
  skeleton: |
    #!/bin/sh

    # [COMPLIANCE CHECK: user_handling]
    if [ "$(id -u)" -eq 0 ]; then
        if id attacker > /dev/null 2>&1; then
            exec su attacker -c "bash /tmp/verify.sh"
        fi
        echo "⚠️  以 root 运行，权限屏障验证可能失效"
    fi
    echo "当前用户: $(whoami) (uid=$(id -u))"

    # [COMPLIANCE CHECK: precondition]
    echo "━━━ [前置检查] 目标文件/资源可达性 ━━━"
    if [ -f __TARGET_PATH__ ]; then
        echo "  ✅ 目标文件存在"
        ls -l __TARGET_PATH__
    else
        echo "  ❌ 目标文件不存在: __TARGET_PATH__"
        exit 1
    fi
    echo ""

    # [COMPLIANCE CHECK: barrier]
    echo "━━━ [阶段 1/3] 身份与权限屏障 ━━━"
    if [ -r __TARGET_PATH__ ]; then
        echo "  ⚠️  当前用户可读 __TARGET_PATH__（如为非特权用户则说明权限屏障缺失）"
    else
        echo "  ✅ 权限屏障生效 — 当前用户不可读 __TARGET_PATH__"
    fi
    echo ""

    # [COMPLIANCE CHECK: exec_exp]
    echo "━━━ [阶段 2/3] 泄露内容展示 ━━━"
    bash /tmp/exp.sh
    echo ""

    # [COMPLIANCE CHECK: evidence_check]
    if [ -f /tmp/leaked_data ] && [ -s /tmp/leaked_data ]; then
        LEAKED_SIZE=$(wc -c < /tmp/leaked_data)
        echo "✅ 确认 — 成功读取 ${LEAKED_SIZE} 字节"
        head -15 /tmp/leaked_data
    else
        echo "❌ 未检测到泄露数据"
        exit 1
    fi
    echo ""

    # [COMPLIANCE CHECK: impact_assessment]
    echo "━━━ [阶段 3/3] 影响评估 ━━━"
    LEAKED=$(cat /tmp/leaked_data 2>/dev/null)
    FOUND=0
    for kw in "password" "secret" "api_key" "token" "PRIVATE KEY"; do
        echo "$LEAKED" | grep -qi "$kw" && echo "  🚨 含敏感关键字: $kw" && FOUND=1
    done
    [ "$FOUND" -eq 0 ] && echo "  ℹ️  未检测到已知敏感模式"
    echo ""

    # [COMPLIANCE CHECK: end_marker]
    echo "本地信息泄露验证完成"

  end_marker: "本地信息泄露验证完成"

readme_chapters:
  - name: "快速验证"
    desc: "🔴 验证命令: `docker exec -u attacker <容器> bash /tmp/verify.sh`。带预期输出最后 5 行。"

files:
  - name: exp.sh
    desc: "漏洞利用（信息窃取）"
    category: exploit
    end_marker: "泄露数据已收集"
    rules:
      - "🔴 exp.sh 必须是 bash 脚本（#!/bin/bash），禁止用 Python"
      - "不使用 set -e，清理命令加 2>/dev/null || true"
      - "只做两件事：① 触发漏洞读取受限数据 ② 写入 /tmp/leaked_data"
      - "泄露数据写入 /tmp/leaked_data"
      - "末尾输出 泄露数据已收集 并展示文件大小"

  - name: verify.sh
    desc: "验证脚本（三段式）"
    category: verify
    end_marker: "本地信息泄露验证完成"
    rules:
      - "按三段式执行：阶段 1 身份权限 → 阶段 2 泄露内容 → 阶段 3 影响评估"
      - "阶段 1：展示当前用户身份 → 展示目标资源权限"
      - "阶段 2：运行 bash /tmp/exp.sh → 检查 /tmp/leaked_data → head 展示"
      - "阶段 3：逐项扫描泄露内容中的敏感信息模式（密码/密钥/令牌/私钥…）"
      - "🔴 阶段 3 禁止编造不存在的凭据，必须基于实际泄露内容扫描"
      - "最后一行严格等于 本地信息泄露验证完成"
      - "禁止在末尾追加额外行（exit/echo/空行）"

inject_on_write:
  verify.sh:
    pre_check: |
      🔴 你即将写入 verify.sh。目标类型: local_information_disclosure。写入前必须确认：

      1. 三段式：阶段 1 身份权限屏障(whoami+ls -l) → 阶段 2 泄露内容 → 阶段 3 影响评估
      2. 阶段 1 展示当前用户身份（whoami, id）和文件权限（ls -l），证明资源本应无法访问
      3. 阶段 2 运行 bash /tmp/exp.sh，检查 /tmp/leaked_data，head -15 展示
      4. 阶段 3 用 grep 扫描泄露内容中的敏感模式，禁止编造不存在的凭据
      5. 不使用 set -e
      6. 最后一行严格等于 本地信息泄露验证完成（嵌入在 ============ 装饰线中的 echo 也算，但不能有额外空行）

    post_check: |
      🔴 verify.sh 写入完成。现在立即 read_file 读回该文件，逐条自检：

      1. 是否有三个阶段标题（━━━ [阶段 1/3] / [阶段 2/3] / [阶段 3/3]）？□
         → 如果缺少 → 用 write_file 重写整个文件
      2. 阶段 1 是否使用 whoami + ls -l？□
         → 如果缺少 whoami 或 ls -l → 用 write_file 重写
      3. 阶段 2 是否运行 bash /tmp/exp.sh 并检查 /tmp/leaked_data？□
         → 如果没有 → 用 write_file 重写
      4. 阶段 3 是否有 grep 敏感模式扫描？□
         → 如果没有 → 用 write_file 重写
      5. 是否有 set -e？□
         → 如果有 → 删除，用 write_file 重写
      6. 末尾是否在 end_marker 之前又用 cat/head dump 了 /tmp/leaked_data？□
         → 阶段 2 已经 head -15 展示过了，末尾只需输出装饰线和完成信息，删除多余的 cat/head

      🔴 任一 □ 打叉 → 立即重写。全部通过后才能继续下一步。

      7. `bash -n` 语法检查是否通过？□
         → 如果不通过 → 修正语法错误，用 write_file 重写

  exp.sh:
    pre_check: |
      🔴 你即将写入 exp.sh。目标类型: local_information_disclosure。写入前必须确认：

      1. 第一行是 #!/bin/bash（绝对禁止用 Python 或其他语言）
      2. 最后一行将严格等于 "泄露数据已收集"
      3. 不使用 set -e，清理命令加 2>/dev/null || true
      4. 只做两件事：① 触发漏洞读取受限数据 ② 写入 /tmp/leaked_data
      5. 禁止在 exp.sh 中包含服务启动命令

    post_check: |
      🔴 exp.sh 写入完成。现在立即 read_file 读回该文件，逐条自检：

      1. 第一行是否是 #!/bin/bash？□
         → 如果不是 → 用 write_file 重写
      2. 最后一行是否严格等于 "泄露数据已收集"？□
         → 如果不是或为裸文本 → 改为 echo "泄露数据已收集"，用 write_file 重写
      3. 是否有 set -e？□
         → 如果有 → 删除 set -e 行，用 write_file 重写
      4. 如果依赖特定服务/环境，是否在 exp.sh 中启动了？□
         → 如果没有 → 加上启动+等待逻辑，用 write_file 重写
      5. 泄露数据是否写入 /tmp/leaked_data 而非其他路径？□
         → 如果不是 → 用 write_file 重写

      🔴 任一 □ 打叉 → 立即重写。全部通过后才能继续下一步。

      7. `bash -n` 语法检查是否通过？□
         → 如果不通过 → 修正语法错误，用 write_file 重写

      10. exp.sh 开头是否清理了 CVE_WORKDIR 工作空间？□
         → 如果没有 → 在开头加 rm -rf "$CVE_WORKDIR" && mkdir -p "$CVE_WORKDIR"，用 write_file 重写
      11. 如果 exp.sh 包含编译命令（go build/gcc/mvn），是否用 background=True 启动而非 timeout 等待？□
         → 如果是同步编译 → 改为 background=True 启动 + 轮询检查二进制
checks:
  - name: "exp.sh 第一行是 #!/bin/bash（不是 #!/usr/bin/env python3）"
    on_fail: "将 exp.sh 改为 bash 脚本，以 #!/bin/bash 开头。exp.sh 运行在容器内必须用 bash，不能用 Python"
  - name: "exp.sh 中将泄露数据写入了 /tmp/leaked_data 且文件非空"
    on_fail: "确保 exp.sh 触发漏洞后将泄露数据写入 /tmp/leaked_data"
  - name: "exp.sh 末尾输出 泄露数据已收集"
    on_fail: "确保 exp.sh 最后一行严格等于 泄露数据已收集"
  - name: "verify.sh 按三段式结构执行（阶段 1/3, 2/3, 3/3）"
    on_fail: "确保 verify.sh 包含三个阶段标题，按身份权限 → 泄露内容 → 影响评估 顺序执行"
  - name: "verify.sh 开头展示了当前用户身份（whoami）和文件权限（ls -l）"
    on_fail: "在 verify.sh 阶段 1 加入 whoami/id 和 ls -l 权限检查"
  - name: "verify.sh 运行了 bash /tmp/exp.sh 并检查了 /tmp/leaked_data"
    on_fail: "确保 verify.sh 开头 bash /tmp/exp.sh，然后 if [ -f /tmp/leaked_data ] 检查"
  - name: "verify.sh 最后一行严格等于 本地信息泄露验证完成"
    on_fail: "删除 verify.sh 末尾多余的 exit/echo/空行，确保最后一行严格等于 本地信息泄露验证完成"
  - name: "verify.sh 阶段 3 扫描了泄露内容中的敏感模式（grep 检测）"
    on_fail: "确保 verify.sh 阶段 3 包含对 /tmp/leaked_data 的 grep 敏感模式扫描"
